<html lang="en">
<head>

<style>
  body { background: color-mix(in srgb, var(--tf-bg) 70%, var(--tf-card)); }
  .boards { display: flex; flex-wrap: wrap; gap: 48px; padding: 40px 32px 96px; justify-content: center; }
  figure { display: flex; flex-direction: column; }
  /* A 412 x 915 screen in a thin bezel */
  .phone { position: relative; width: 424px; padding: 6px; border-radius: 44px; border: 1px solid var(--tf-line); background: var(--tf-raised); box-shadow: var(--shadow-lift); }
  .screen { position: relative; display: flex; flex-direction: column; width: 412px; height: 915px; overflow: hidden; border-radius: 38px; background: var(--tf-bg); color: var(--tf-fg); }
  .cam { position: absolute; left: 50%; top: 12px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #000; z-index: 5; box-shadow: 0 0 0 1px var(--tf-hair); }
  .status { display: flex; align-items: center; justify-content: space-between; height: 36px; flex-shrink: 0; padding: 4px 28px 0; font-size: 13px; font-weight: 500; }
  .status .icons { display: flex; align-items: center; gap: 6px; }
  .body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .navbar { height: 18px; flex-shrink: 0; display: grid; place-items: center; }
  .navbar span { width: 108px; height: 4px; border-radius: 4px; background: var(--tf-fg); opacity: .5; }

  /* Home */
  .home-head { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 20px; }
  .home-head i[data-mark] { width: 28px; height: 28px; color: var(--tf-brand); }
  .boxhead { display: flex; align-items: center; gap: 8px; margin: 0 16px; }
  .boxhead .words { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
  .boxhead .w { display: inline-flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 700; opacity: .3; white-space: nowrap; }
  .boxhead .w.on { opacity: 1; }
  .boxhead .w.on i { color: var(--tf-brand); }
  .boxlist { position: relative; height: 288px; margin-top: 4px; overflow: hidden; }
  .boxlist::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(to bottom, transparent, var(--tf-bg)); }
  .sect { display: flex; align-items: center; gap: 8px; margin: 16px 12px 4px; padding: 4px 8px 8px; border-bottom: 1px solid var(--tf-line); font-size: 15px; font-weight: 700; }
  .sect i { color: var(--tf-brand); }
  .sect small { font-size: 12px; font-weight: 400; color: var(--tf-dim); }
  .notesbar { display: flex; align-items: center; gap: 8px; margin: 0 16px; }
  .notesbar b { font-size: 18px; font-weight: 700; }
  .masonry { display: flex; gap: 0; padding: 0 12px; }
  .masonry .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .masonry .col > * { margin: 4px; }

  /* Note */
  .note-top { display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 8px; }
  .note-top .ibtn { color: var(--tf-fg); }
  .note-page { padding: 8px 20px 0; }
  .note-page h1 { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
  .note-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--tf-faint); }
  .note-meta .ptag { height: 24px; padding: 0 10px; font-size: 13px; gap: 4px; }
  .prose { margin-top: 20px; font-size: 16px; line-height: 1.625; }
  .prose h2 { margin-top: 22px; font-size: 22px; font-weight: 700; letter-spacing: -0.025em; }
  .prose p + p { margin-top: 8px; }
  .prose table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 13px; }
  .prose th, .prose td { padding: 6px 8px; border: 1px solid var(--tf-line); text-align: left; }
  .prose th { background: var(--tf-card); font-weight: 600; }
  .checks { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .checks div { display: flex; align-items: center; gap: 12px; }
  .checks .done { color: var(--tf-faint); text-decoration: line-through; }
  .fmt { display: flex; align-items: center; padding: 0 8px; border-top: 1px solid var(--tf-line); background: var(--tf-bg); }
  .fmt .ibtn { flex: 1; width: auto; }
  .fmt .ibtn.on { background: var(--tf-raised); color: var(--tf-brand); }

  /* Tasks */
  .shead { display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px; }
  .shead .title { flex: 1; padding: 0 4px; font-size: 18px; font-weight: 600; }
  .large { padding: 4px 20px 8px; }
  .large h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15; }
  .large p { margin-top: 2px; font-size: 14px; color: var(--tf-dim); }
  .ptabs { position: relative; display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--tf-line); }
  .ptabs span { display: flex; align-items: center; height: 48px; padding: 0 12px; border-bottom: 2px solid transparent; font-size: 15px; font-weight: 500; color: var(--tf-dim); }
  .ptabs span.on { border-bottom-color: var(--tf-brand); color: var(--tf-fg); font-weight: 600; }
  .ptabs::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 32px; background: linear-gradient(to right, transparent, var(--tf-bg)); }
  .fab { position: absolute; right: 16px; bottom: 16px; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: var(--tf-brand); color: var(--tf-bg); box-shadow: 0 6px 16px rgba(0,0,0,.35); }

  /* Ask */
  .chat { display: flex; flex-direction: column; gap: 20px; padding: 12px 16px; }
  .answer { font-size: 15px; line-height: 22px; }
  .answer b { font-weight: 700; }
  .foot-composer { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 12px 8px; background: var(--tf-bg); }

  /* Share */
  .card { border-radius: var(--tw-2xl); border: 1px solid var(--tf-line); background: var(--tf-card); }
  .card-title { padding: 14px 16px 0; font-size: 13px; font-weight: 600; color: var(--tf-dim); }
  .list-title { padding: 0 4px 8px; font-size: 13px; font-weight: 600; color: var(--tf-dim); }
  .lrow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; }
  .lrow + .lrow { border-top: 1px solid var(--tf-line); }
  .lrow .ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; background: var(--tf-accent); color: var(--tf-brand); }
  .lrow .t { font-size: 15px; font-weight: 500; }
  .lrow .h { font-size: 13px; color: var(--tf-dim); }
  .textarea { min-height: 72px; padding: 12px 16px; border-radius: var(--tw-2xl); border: 1px solid var(--tf-line); background: var(--tf-card); font-size: 15px; color: var(--tf-faint); }
  .switch { position: relative; width: 52px; height: 32px; border-radius: 16px; background: var(--tf-brand); }
  .switch::after { content: ""; position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--tf-bg); }

  /* ---- Proposed Home: the lens beside the mark, search top right, a bigger strip, the search drawer ---- */
  .proposed-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; margin-right: 8px; border-radius: 999px; background: var(--tf-accent); color: var(--tf-brand); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .nhead { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 8px 0 16px; }
  .lensmark { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 6px; border-radius: 999px; background: var(--tf-accent); color: var(--tf-brand); min-width: 0; max-width: 70%; }
  .lensmark i[data-mark] { width: 32px; height: 32px; flex-shrink: 0; }
  .lensmark .lname { font-size: 17px; font-weight: 700; color: var(--tf-fg); }
  .lensmark.off { background: transparent; padding-left: 0; }
  .lensmark.off .lname { color: var(--tf-faint); font-weight: 600; }
  .searchbtn { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; color: var(--tf-fg); }
  .searchbtn.on { background: var(--tf-raised); }
  .bdays { margin: 4px 0 0; }
  .bdays .month { display: flex; align-items: center; height: 18px; margin: 0 12px; }
  .bdays .month b { flex: 1; text-align: center; font-size: 11px; font-weight: 500; color: var(--tf-faint); }
  .bdays .month .side { flex: 0 0 32px; display: grid; place-items: center; color: var(--tf-brand); }
  .bstrip { position: relative; display: flex; justify-content: center; gap: 8px; padding: 10px 0 6px; overflow: hidden; }
  .bstrip::before, .bstrip::after { content: ""; position: absolute; top: 0; bottom: 0; width: 28px; z-index: 2; pointer-events: none; }
  .bstrip::before { left: 0; background: linear-gradient(to right, var(--tf-bg), transparent); }
  .bstrip::after { right: 0; background: linear-gradient(to left, var(--tf-bg), transparent); }
  .bday { flex: 0 0 52px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; border: 2px solid transparent; background: color-mix(in srgb, var(--tf-fg) 5%, transparent); color: var(--tf-dim); }
  .bday .wd { font-size: 11px; font-weight: 500; }
  .bday .dn { font-size: 20px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--tf-fg); }
  .bday { position: relative; }
  /* volume: the cell fills from the bottom, its height relative to the busiest day in the strip (no numbers, no track) */
  .bday { overflow: hidden; isolation: isolate; }
  .bday::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--v, 0%); z-index: -1; background: color-mix(in srgb, var(--tf-brand) 32%, transparent); transition: height .3s var(--ease-out); }
  .bday.late::before { background: color-mix(in srgb, var(--tf-warn) 38%, transparent); }
  .bday.slot::before { background: color-mix(in srgb, var(--tf-brand) 45%, transparent); }
  .bday.past { opacity: .4; }
  .bday.today .dn { color: var(--tf-brand); font-weight: 800; }
  .bday.slot { border-color: var(--tf-brand); background: var(--tf-accent); }
  .bday.slot .wd { color: var(--tf-brand); }

  /* the drawer, down from the header over a dimmed Home */
  .scrim { position: absolute; inset: 0; z-index: 4; background: var(--tf-scrim); }
  .drawer { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; flex-direction: column; max-height: 100%; border-radius: 0 0 28px 28px; background: var(--tf-card); box-shadow: 0 16px 40px rgba(0,0,0,.4); }
  .sfield { display: flex; align-items: center; gap: 10px; height: 52px; margin: 8px 16px 0; padding: 0 6px 0 16px; border-radius: 999px; border: 2px solid var(--tf-brand); background: var(--tf-bg); }
  .sfield .q { flex: 1; font-size: 16px; }
  .sfield .caret { display: inline-block; width: 2px; height: 20px; margin-left: 1px; vertical-align: -4px; background: var(--tf-brand); }
  .sfield .clear { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--tf-dim); }
  .scope { display: flex; align-items: center; gap: 6px; padding: 10px 20px 0; font-size: 13px; color: var(--tf-dim); }
  .scope a { margin-left: auto; color: var(--tf-brand); font-weight: 600; }
  .srow { display: flex; gap: 8px; padding: 12px 16px 0; overflow: hidden; }
  .sgroup { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 4px; font-size: 13px; font-weight: 600; color: var(--tf-dim); }
  .sgroup span { font-weight: 500; color: var(--tf-faint); }
  .hit { display: flex; align-items: flex-start; gap: 12px; padding: 10px 20px; }
  .hit .sw { flex: 0 0 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--tile-bg, var(--tf-raised)); color: var(--tile-line, var(--tf-dim)); }
  .hit .t { font-size: 15px; font-weight: 600; }
  .hit .s { font-size: 13px; line-height: 18px; color: var(--tf-dim); }
  .hit mark { background: var(--tf-accent); color: var(--tf-fg); font-weight: 700; border-radius: 3px; padding: 0 2px; }
  .handle { width: 36px; height: 4px; margin: 10px auto 10px; border-radius: 4px; background: var(--tf-line); }
  .kbd-android { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 8px 4px 6px; background: var(--tf-raised); }
  .kbd-android .r { display: flex; justify-content: center; gap: 5px; margin-bottom: 8px; }
  .kbd-android .k { flex: 0 0 34px; height: 42px; display: grid; place-items: center; border-radius: 6px; background: var(--tf-card); font-size: 18px; color: var(--tf-fg); }
  .kbd-android .k.w { flex-basis: 52px; font-size: 13px; color: var(--tf-dim); }
  .kbd-android .k.sp { flex: 0 0 180px; }
  .kbd-android .k.go { flex-basis: 52px; background: var(--tf-brand); color: var(--tf-bg); }
</style>
</head>
