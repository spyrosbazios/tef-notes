name: Release

# A tag vX.Y.Z on main is the release (CONTRIBUTING.md, Versioning): the tag is the repo's one version, read by
# scripts/version.sh. This builds the extension zip and attaches it to a GitHub release whose notes are CHANGELOG.md's
# section for the version. The server image is docker.yml's. The phone gets the web app installed from Chrome, so no APK.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The version server/agent/Dockerfile ships (oven/bun:1.3.9-slim), as ci.yml.
  BUN_VERSION: "1.3.9"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  extension:
    name: Extension zip
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEF_NOTES_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build
        working-directory: extension
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Zip
        run: |
          # Chrome's `version` takes no pre-release suffix (vite.config.ts puts it in `version_name`).
          grep -F "\"version\": \"${TEF_NOTES_VERSION%%-*}\"" extension/dist/manifest.json
          (cd extension/dist && zip -qr "$GITHUB_WORKSPACE/tef-notes-extension-$TEF_NOTES_VERSION.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: tef-notes-extension-*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The notes are CHANGELOG.md's "## X.Y.Z - date" section, without its heading; a tag with none fails the release.
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{ if (p) exit; p = ($2 == v); next } p' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no ## $VERSION section"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
