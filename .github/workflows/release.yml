name: Release

# A tag vX.Y.Z on main is the release (CONTRIBUTING.md, Versioning): the tag is the repo's one version, read by
# scripts/version.sh. This builds the extension and the Android APK, and attaches both to a GitHub release whose notes are
# CHANGELOG.md's section for the version. The server image is docker.yml's.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The version server/agent/Dockerfile ships (oven/bun:1.3.9-slim), as ci.yml.
  BUN_VERSION: "1.3.9"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  extension:
    name: Extension zip
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEF_NOTES_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build
        working-directory: extension
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Zip
        run: |
          # Chrome's `version` takes no pre-release suffix (vite.config.ts puts it in `version_name`).
          grep -F "\"version\": \"${TEF_NOTES_VERSION%%-*}\"" extension/dist/manifest.json
          (cd extension/dist && zip -qr "$GITHUB_WORKSPACE/tef-notes-extension-$TEF_NOTES_VERSION.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: tef-notes-extension-*.zip
          if-no-files-found: error

  apk:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEF_NOTES_VERSION: ${{ needs.version.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # The generated editor and PDF pages (mobile `pages`) are built from web/.
      - name: Install
        run: |
          (cd web && bun install --frozen-lockfile)
          (cd mobile && npx pnpm@11 install --frozen-lockfile)
      - name: Build the pages and generate android/
        working-directory: mobile
        run: |
          npx pnpm@11 pages
          CI=1 npx expo prebuild --platform android --no-install
      # Without the keystore secret (a fork) the APK is signed with the generated project's debug key
      # (mobile/plugins/release-signing.js).
      - name: Keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "TEF_NOTES_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with the debug key"
          fi
      - name: Build
        working-directory: mobile/android
        env:
          TEF_NOTES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TEF_NOTES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TEF_NOTES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --build-cache --max-workers=2
      - name: Name the APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk "tef-notes-$TEF_NOTES_VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: tef-notes-*.apk
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, extension, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The notes are CHANGELOG.md's "## X.Y.Z - date" section, without its heading; a tag with none fails the release.
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{ if (p) exit; p = ($2 == v); next } p' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no ## $VERSION section"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
