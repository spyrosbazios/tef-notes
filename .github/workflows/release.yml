name: Release

# A tag vX.Y.Z on main is the release (CONTRIBUTING.md, Versioning): the tag is the repo's one version, read by
# scripts/version.sh. This builds the extension zip and the Android companion's APK, renders the promo film (film.yml), and
# attaches them to a GitHub release whose notes are CHANGELOG.md's section for the version. The server image is docker.yml's.
# The phone's app is the web app, installed from Chrome; the APK is the optional companion beside it (android/README.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The version server/agent/Dockerfile ships (oven/bun:1.3.9-slim), as ci.yml.
  BUN_VERSION: "1.3.9"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  extension:
    name: Extension zip
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEF_NOTES_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build
        working-directory: extension
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Zip
        run: |
          # Chrome's `version` takes no pre-release suffix (vite.config.ts puts it in `version_name`).
          grep -F "\"version\": \"${TEF_NOTES_VERSION%%-*}\"" extension/dist/manifest.json
          (cd extension/dist && zip -qr "$GITHUB_WORKSPACE/tef-notes-extension-$TEF_NOTES_VERSION.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: tef-notes-extension-*.zip
          if-no-files-found: error

  # The companion's APK, signed with the repository's own key: Android installs an update only over the same signature, so
  # an APK signed with a runner's throwaway debug key would strand everyone who installed it. Without the signing key's
  # four repository secrets (the keystore file as base64, its password, the key's alias and the key's password) no APK is
  # attached, and the run says so.
  android:
    name: Android companion APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEF_NOTES_VERSION: ${{ needs.version.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.TEF_NOTES_KEYSTORE_BASE64 }}
    steps:
      - id: key
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::No signing key is set for this repository: this release has no Android APK"; fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.present
      - uses: oven-sh/setup-bun@v2
        if: steps.key.outputs.present
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v6
        if: steps.key.outputs.present
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        if: steps.key.outputs.present
        working-directory: android
        env:
          TEF_NOTES_KEYSTORE: ${{ runner.temp }}/release.jks
          TEF_NOTES_KEYSTORE_PASSWORD: ${{ secrets.TEF_NOTES_KEYSTORE_PASSWORD }}
          TEF_NOTES_KEY_ALIAS: ${{ secrets.TEF_NOTES_KEY_ALIAS }}
          TEF_NOTES_KEY_PASSWORD: ${{ secrets.TEF_NOTES_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$TEF_NOTES_KEYSTORE"
          bun install --frozen-lockfile
          ./gradle.sh --no-daemon testDebugUnitTest lintRelease assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/tef-notes-companion-$TEF_NOTES_VERSION.apk"
      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.present
        with:
          name: android
          path: tef-notes-companion-*.apk
          if-no-files-found: error

  film:
    name: Promo film
    uses: ./.github/workflows/film.yml

  release:
    name: GitHub release
    needs: [version, extension, android, film]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The film's artifact is film.mp4 and its still: the release carries the film, under the version's name.
      - name: Name the film
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv dist/film.mp4 "dist/tef-notes-film-$VERSION.mp4"
          rm dist/film-poster.jpg
      # The notes are CHANGELOG.md's "## X.Y.Z - date" section, without its heading; a tag with none fails the release.
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{ if (p) exit; p = ($2 == v); next } p' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no ## $VERSION section"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
