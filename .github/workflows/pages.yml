name: Pages

# The marketing page (site/) at https://spyrosbazios.github.io/tef-notes/. The repo's Pages source must be "GitHub Actions"
# (Settings > Pages). The page imports the palette and fonts from packages/core and mobile/assets, so those trigger it too.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/core/**"
      - "mobile/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Pages deploys one at a time; a newer push waits for the running one rather than cancelling a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: actions/configure-pages@v6
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run build
        working-directory: site
        env:
          # The site lives under /tef-notes/ here; its Dockerfile builds with the default "/".
          SITE_BASE: /tef-notes/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
