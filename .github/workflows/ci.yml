name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The version server/agent/Dockerfile ships (oven/bun:1.3.9-slim).
  BUN_VERSION: "1.3.9"

jobs:
  boundaries:
    name: Architecture - import boundaries, migration names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun scripts/check-boundaries.ts
      - run: bun test scripts/check-boundaries.test.ts
      - run: bun scripts/check-migrations.ts
      - run: bun test scripts/check-migrations.test.ts

  # Dead code across every module: unused files, dependencies and unlisted ones fail; unused exports only warn (knip.json).
  knip:
    name: Knip - unused files, dependencies, exports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-knip-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-knip-${{ runner.os }}-${{ env.BUN_VERSION }}-
      # Knip reads each module's installed packages to tell a used dependency from a dead one.
      - run: |
          bun install --frozen-lockfile
          for d in packages/core web cli extension site video server/agent android; do (cd "$d" && bun install --frozen-lockfile); done
      - run: bun run knip

  core:
    name: Core - lint, tests, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('packages/core/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run typecheck

  server:
    name: Server hooks - tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The hooks have no package.json and their tests load no package. server/bunfig.toml preloads test/core.ts, which
      # builds pb_hooks/lib/core.js (the clients' code bundled for PocketBase) before any test loads it.
      - run: bun test ./test

  pocketbase-contract:
    name: PocketBase - HTTP integration contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Isolated temporary data, real migrations/hooks, Dockerfile's PocketBase pin.
      # Missing binary/download or startup failures fail this job; nothing is skipped.
      # run.ts builds pb_hooks/lib/core.js, the hooks' bundle of the clients' code, before it starts PocketBase.
      - run: bun install --frozen-lockfile
        working-directory: server/agent
      - run: bun --no-env-file server/integration/run.ts --application
      - run: bun server/agent/node_modules/typescript/bin/tsc --project server/integration/tsconfig.json

  agent:
    name: Agent - lint, tests, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/agent
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('server/agent/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run typecheck

  web:
    name: Web - lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  cli:
    name: CLI - typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('cli/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # The promo film's code and its storyboard's rules; film.yml renders it.
  video:
    name: Film - lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('video/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  # What pages.yml builds after merge, checked before it: the page's lint, then its build (which typechecks first).
  # The film's files are optional here; pages.yml supplies them.
  site:
    name: Site - lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  extension:
    name: Extension - lint, typecheck, tests, unsigned build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('extension/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  # What docker.yml publishes on a tag, built here without pushing: a build that only fails inside an image (its Bun is
  # Alpine's musl, not this runner's glibc) must not first show itself at a deploy. The `server` target is the published
  # image and has no signing stage, so no CRX key is needed. amd64 only: the web build runs on the builder's own platform
  # and the agent has no native step of its own; the multi-arch build stays docker.yml's.
  images:
    name: Images - server and agent build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
            target: server
          - name: agent
            dockerfile: server/agent/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

  android:
    name: Android companion - typecheck, tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the version is the latest tag (scripts/version.sh)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/tefnotes
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle.sh', 'android/*.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      # The build's resources come from packages/core and lucide (scripts/generate.ts).
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Signed with the runner's debug key: this checks that it builds; the release signs its own.
      - run: ./gradle.sh --no-daemon testDebugUnitTest lintRelease assembleRelease
