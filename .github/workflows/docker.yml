# Publishes the server images to GHCR on every version tag: ghcr.io/spyrosbazios/tef-notes (PocketBase, hooks, migrations and
# the web app) and ghcr.io/spyrosbazios/tef-notes-agent (the chat agent), each for amd64 and arm64, tagged <version> and
# latest. The signed Chrome extension is not in them (it needs the owner's origin and key): server/docker-compose.build.yml.
name: Docker images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/spyrosbazios/tef-notes
            dockerfile: server/Dockerfile
            target: server
          - image: ghcr.io/spyrosbazios/tef-notes-agent
            dockerfile: server/agent/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
      # `latest` comes with a release tag by metadata-action's default (a pre-release, v0.2.0-rc.1, does not get it).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
