name: Film

# The promo film (video/): renders the storyboard to film.mp4 and its still, film-poster.jpg, as the artifact `film`.
# pages.yml calls it (the site shows the film) and so does release.yml (a release carries it); run it by hand to see a cut
# without publishing anything. The render is cached under a key of everything the film is drawn from, so a push that
# changes none of it renders nothing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The version server/agent/Dockerfile ships (oven/bun:1.3.9-slim), as ci.yml.
  BUN_VERSION: "1.3.9"

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The film is its storyboard and scenes, the site's drawn screens and look, the core's palette, and the fonts.
      - id: film
        uses: actions/cache@v6
        with:
          path: video/out
          key: film-${{ hashFiles('video/src/**', 'video/scripts/**', 'video/bundler.ts', 'video/bun.lock', 'site/src/**', 'site/washes.ts', 'packages/core/src/**', 'assets/fonts/**') }}
      - uses: oven-sh/setup-bun@v2
        if: steps.film.outputs.cache-hit != 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        if: steps.film.outputs.cache-hit != 'true'
        working-directory: video
        run: bun install --frozen-lockfile
      # Remotion fetches its own headless Chrome and brings its own FFmpeg.
      - name: Render
        if: steps.film.outputs.cache-hit != 'true'
        working-directory: video
        run: bun run film
      - uses: actions/upload-artifact@v7
        with:
          name: film
          path: |
            video/out/film.mp4
            video/out/film-poster.jpg
          if-no-files-found: error
