<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TEF Notes settings</title>
    <script type="module" src="./options.ts"></script>
  </head>
  <body>
    <main class="options">
      <h1 id="brand"></h1>
      <form id="form">
        <label for="server">Server address</label>
        <input id="server" type="url" placeholder="https://host:port" autocomplete="off" required />
        <p class="dim">The address your TEF Notes server is served at. Chrome will ask to let this extension reach it. Another site only when you allow it, to read a picture you save from there.</p>
        <button type="submit">Save</button>
      </form>
      <div id="status" class="status" hidden></div>
    </main>
  </body>
</html>
